<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4VMRREMENR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4VMRREMENR');
  </script>

  <meta charset="utf-8">
  <meta name="generator" content="GitLab Pages">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameLab</title>
  <link rel="icon" href="../assets/images/favicon.svg" type="image/svg+xml">

  <!-- Normalize: -->
  <link href="https://unpkg.com/@csstools/normalize.css" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">

  <script src="../assets/js/sidescroll.js" defer></script>
  <script src="../assets/js/toggle-searchbar.js" defer></script>
  <script src="../assets/js/games-display.js" type="module" defer></script>
</head>

<body>
<header>
  <div class="container header">
    <a href="../" title="Homepage">
      <span class="favicon"></span>
    </a>
    <div id="nav-container">
      <nav>
        <ul class="navlist main">
          <li>
            <a href="../" title="Homepage">Home</a>
          </li>
          <li>
            <a href="../genres" title="Genres">Genres</a>
          </li>
          <li>
            <a href="../game-picker" title="Gamepicker">Gamepicker</a>
          </li>
        </ul>
      </nav>
      <div>
        <form action="../games/" method="GET">
          <input type="search" name="query" placeholder="Search games..." required aria-label="Search">
          <button type="submit" class="button">Go</button>
        </form>
      </div>
    </div>
    <nav class="nav icons">
      <ul class="navlist">
        <li>
          <button
            id="search-toggle"
            title="Find Games"
            aria-label="Toggle Game Search"
          >
            <img src="../assets/images/search_icon.svg" class="icon search" alt="Search">
          </button>
        </li>
        <li>
          <a
            href="../games/stores"
            title="Find Game Stores"
          >
            <img src="../assets/images/globe_pin_icon.svg" class="icon" alt="Gamestores">
          </a>
        </li>
        <li>
          <a
            href="../profile"
            title="Profile Page"
          >
            <img src="../assets/images/profile_icon.svg" class="icon" alt="Profile">
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="container main">
    <section>
      <h1 id="games-page-title" class="gradient-title fs-2"></h1>

      <!-- Possible errors: -->
      <p id="games-error" class='error'></p>

      <!-- Sidescroller to display search results: -->
      <div class="sidescroller" id="games-sidescroller">
        <div class="chevron-container left">
          <span class="svg large chevron"></span>
        </div>
        <ul id="search-results-list" class="sidescroll-list">
          <!-- Search results injected here -->

          <!-- This visually hidden list item is required for sidescroll.js;
              it needs it to calculate the min-width of a game-card -->
          <li class='game-card visually-hidden'></li>
        </ul>
        <div class="chevron-container right">
          <span class="svg large chevron"></span>
        </div>
      </div>

      <!-- div to display a single game result: -->
      <div id="single-game-result" class="">

      </div>
    </section>
  </div>
</main>

<footer>
  <div class="container row-around">
    <p>&copy; 2025 GameLab</p>
    <p></p>
  </div>
</footer>
</body>
</html>
