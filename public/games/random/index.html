<body>
<header>
  <div class="container header">
    <a href="../../" title="Homepage">
      <span class="favicon"></span>
    </a>
    <div id="nav-container">
      <nav>
        <ul class="navlist main">
          <li>
            <a href="../../" title="Homepage">Home</a>
          </li>
          <li>
            <a href="../../categories" title="Categories">Categories</a>
          </li>
          <li>
            <a href="../../questions" title="Questions">Questions</a>
          </li>
          <li>
            <a href="../../games/random" title="Random Game">Random Game</a>
          </li>
        </ul>
      </nav>
      <div>
        <form action="../../games/" method="GET">
          <input type="search" name="query" placeholder="Search games..." required aria-label="Search">
          <button type="submit" class="button">Go</button>
        </form>
      </div>
    </div>
    <nav class="nav icons">
      <ul class="navlist">
        <li>
          <button
            id="search-toggle"
            title="Find Games"
            aria-label="Toggle Game Search"
          >
            <img src="../../assets/images/search_icon.svg" class="icon search" alt="Search">
          </button>
        </li>
        <li>
          <a
            href="../../games/stores"
            title="Find Game Stores"
          >
            <img src="../../assets/images/globe_pin_icon.svg" class="icon" alt="Gamestores">
          </a>
        </li>
        <li>
          <a
            href="../../profile"
            title="Profile Page"
          >
            <img src="../../assets/images/profile_icon.svg" class="icon" alt="Profile">
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main class="game-page" data-status="idle">
  <div class="container main">
    <h1 class="page-title">Random game</h1>

    <section class="game" data-game>
      <div class="game-img">
        <img data-field="cover" src="../../assets/images/favicon.svg" alt="Cover art of the selected game">
      </div>

      <div class="game-info">
        <h2 class="game-name" data-field="name">Game Title</h2>

        <ul class="tags" data-field="tags">
          <!-- tags injected here -->
        </ul>

        <div class="rating" data-field="rating-wrapper" hidden>
          <div class="rating-bar" aria-hidden="true">
            <div class="rating-fill" data-field="rating-fill" style="width: 0%;"></div>
          </div>
          <span class="rating-text" data-field="rating-text">Rating</span>
        </div>

        <p class="explanaiton" data-field="summary">
          Fast-paced combat and procedural levels keep each run fresh.
        </p>

        <p class="price"><span class="price-now" data-field="price"></span></p>
      </div>
    </section>

    <div class="notice" data-field="notice" hidden></div>
  </div>
</main>

<footer class="site-footer">

  </div>
</footer>
