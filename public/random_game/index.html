<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="generator" content="GitLab Pages">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game picker website</title>
  <link rel="stylesheet" href="../style.css">
</head>

<body>
<header>
  <nav class="container">
    <ul class="navlist row-between">
      <li>
        <a class="navlink py1" href="../" title="Homepage">
          <img
            class="image-icon"
            src="../images/gaming_logo_idea.jpg"
            width="30"
            alt="Homepage">
        </a>
      </li>
      <li>
        <a class="navlink py1" href="../" title="Homepage">Home</a>
      </li>
      <li>
        <a class="navlink py1" href="../categories" title="Categories">Categories</a>
      </li>
      <li>
        <a class="navlink py1" href="../questions" title="Questions">Questions</a>
      </li>
      <li>
        <a class="navlink py1" href="./" title="Random Game">Random Game</a>
      </li>
    </ul>
  </nav>
</header>
  
 <main class="container game-page">
    <h1 class="page-title">Random game</h1>

    <section class="game">
      <div class="game-img">
        <img src="../images/gaming_logo_idea.jpg"
             alt="Cover art of the selected game">
      </div>

      <div class="game-info">
        <h2 class="game-name">Game Title</h2>

        <ul class="tags">
          <li class="tag">Action</li>
          <li class="tag">Roguelike</li>
          <li class="tag">Singleplayer</li>
        </ul>

        <div class="rating">
          <div class="rating-bar"><div class="rating-fill" style="width: 88%;"></div></div> 
          <span class="rating-text">Very Positive (88%) on Steam</span>
        </div>

        <p class="explanaiton">
          Fast-paced combat and
          procedural levels keep each run fresh.
        </p>

        <p class="price"><span class="price-now">$19.99</span></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 Gamegrid</p>
    </div>
  </footer>

</body>
</html>
