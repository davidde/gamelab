<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="generator" content="GitLab Pages">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameLab</title>

  <!-- Normalize: -->
  <link href="https://unpkg.com/@csstools/normalize.css" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <script src="./assets/js/init-data.js" defer></script>
  <script src="./assets/js/sidescroll.js" defer></script>
  <script src="./assets/js/search.js" defer></script>
</head>

<body>
<header>
  <div class="container header">
    <a href="./" title="Homepage">
      <img
        class="favicon"
        src="./assets/images/favicon.png"
        alt="Homepage">
    </a>
    <div id="nav-container">
      <nav>
        <ul class="navlist main">
          <li>
            <a href="./" title="Homepage">Home</a>
          </li>
          <li>
            <a href="./categories" title="Categories">Categories</a>
          </li>
          <li>
            <a href="./questions" title="Questions">Questions</a>
          </li>
          <li>
            <a href="./game/random" title="Random Game">Random Game</a>
          </li>
        </ul>
      </nav>
      <div>
        <input type="search" placeholder="Search games..." aria-label="Search">
      </div>
    </div>
    <nav>
      <ul class="navlist icons">
        <li>
          <button
            id="search-toggle"
            aria-label="Toggle Search"
          >
            <img src="./assets/images/search_icon.svg" class="icon search" alt="Search">
          </button>
        </li>
        <li>
          <a
            href="./game/stores"
            title="Game stores"
          >
            <img src="./assets/images/globe_pin_icon.svg" class="icon" alt="Gamestores">
          </a>
        </li>
        <li>
          <a
            href="./login"
            title="Login Page"
          >
            <img src="./assets/images/login_icon.svg" class="icon" alt="Login">
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="container main">
    <section>
      <h1 class="gradient-title">Trending Top 100</h1>

      <div class="sidescroller">
        <div class="chevron-container left">
          <span class="svg large chevron"></span>
        </div>
        <ul id="trending" class="sidescroll-list">
          <!-- Game data injected here! -->
        </ul>
        <div class="chevron-container right">
          <span class="svg large chevron"></span>
        </div>
      </div>
    </section>

    <span class="game-card" style="visibility: hidden;"></span>

    <section>
      <h1 class="gradient-title">All Time Favourites</h1>

      <div class="sidescroller">
        <div class="chevron-container left">
          <span class="svg large chevron"></span>
        </div>
        <ul id="favourites" class="sidescroll-list">
          <!-- Game data injected here! -->
        </ul>
        <div class="chevron-container right">
          <span class="svg large chevron"></span>
        </div>
      </div>
    </section>
  </div>
</main>

<footer>
  <div class="container row-around">
    <p>&copy; 2025 GameLab</p>
    <p></p>
  </div>
</footer>
</body>
</html>
